name: Update Docs

on:

  workflow_dispatch:
    inputs:
      repo_owner:
        required: true
      repo_name:
        required: true


jobs:

  trigger-ci:
    name: Trigger CI

    runs-on: ubuntu-latest

    steps:

      - name: Trigger Workflow
        id: trigger-workflow
        run: |
           repo_owner=${{ github.events.inputs.repo_owner }}
           repo_name=${{ github.events.inputs.repo_name }}
           curl \
            --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vjankraemer/secret-ci-test/dispatches \
           -d '{"event_type": "fancy_event", "client_payload": {"world": "Earth"}}'
